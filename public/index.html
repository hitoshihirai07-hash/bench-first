<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="website">

  <meta property="og:description" content="代打か、続投か。終盤の勝負どころを指揮する野球ゲーム。PC・スマホで遊べる、今日の共通のお題に挑戦。">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ベンチからの一手｜あなたなら、どう采配する？">
  <meta name="twitter:description" content="終盤の勝負どころを指揮する野球ゲーム。今日の共通のお題に挑戦。">
  <meta name="twitter:image" content="https://bench-first.pages.dev/assets/ogp-v03.png">
  <meta name="twitter:image:alt" content="ベンチからの一手。代打か、続投か。あなたなら、どう采配する？">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=03">
  <script src="./engine.js?v=03" defer></script><script src="./motion.js?v=03" defer></script><script src="./sharing.js?v=03" defer></script><script src="./app.js?v=03" defer></script>
</head>
<body>
  <header class="header"><div class="brand"><img src="./assets/icon.svg" alt="" width="36" height="36"><h1>ベンチからの一手</h1><span class="tagline">采配で、もうひとつのドラマを。</span></div><div class="header-actions"><button id="help" class="small-button">遊び方</button><button id="restart" class="small-button orange-outline">はじめから</button></div></header>
  <main>
    <section id="scoreboard" class="scoreboard" aria-label="試合状況"></section>
    <div class="game-toolbar"><button id="daily" class="daily-button">今日の共通のお題</button><button id="share-links" class="link-toolbar-button" aria-label="お題へのリンクを作る">リンク</button><span id="challenge-label"></span><label class="speed-control">演出 <select id="animation-speed" aria-label="演出の速さ"><option value="normal">標準</option><option value="fast">速い</option><option value="none">なし</option></select></label></div>
    <div class="game-layout">
      <section class="field-panel" aria-label="球場と対戦選手">
        <div class="field" id="field"><img class="stadium" src="./assets/stadium.png" alt="緑の外野と土の内野が広がる球場"><div id="field-state"></div><div id="motion-layer" aria-hidden="true"></div><div id="play-flash" aria-hidden="true"></div></div>
        <div id="matchup" class="matchup"></div>
        <div id="upcoming" class="upcoming" aria-label="次の3打者"></div>
      </section>
      <section class="command-panel" aria-label="監督の采配">
        <div class="command-heading"><h2 id="command-title">あなたの采配で、<br>流れを変える。</h2><span id="phase" class="phase"></span></div>
        <div class="tabs" role="tablist" aria-label="表示切り替え"><button role="tab" id="tab-tactics" data-tab="tactics" aria-controls="panel" aria-selected="true">采配</button><button role="tab" id="tab-bench" data-tab="bench" aria-controls="panel" aria-selected="false">ベンチ</button><button role="tab" id="tab-lineup" data-tab="lineup" aria-controls="panel" aria-selected="false">打順</button><button role="tab" id="tab-record" data-tab="record" aria-controls="panel" aria-selected="false">記録</button></div>
        <div id="panel" role="tabpanel" aria-labelledby="tab-tactics"></div>
      </section>
    </div>
    <section class="recent"><h2>最近のプレー</h2><div id="recent" aria-live="polite" aria-atomic="true"></div></section>
    <footer><a href="https://pro-baseball-watch-guide.com/" target="_blank" rel="noopener">プロ野球観戦メモ</a><span>架空の球団・選手によるゲーム · 試作版 0.3</span><span id="save-status"></span></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status"></div>
  <noscript>このゲームを遊ぶには、ブラウザのJavaScriptを有効にしてください。</noscript>
</body>
</html>
